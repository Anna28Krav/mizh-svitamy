<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Твій простір · Між світами</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#2d2233;color:#f5eadf}.entry{width:min(100%,470px);padding:35px;border:1px solid #bcabc755;border-radius:24px;background:#35273b}.entry h1{font-family:Georgia,serif;font-size:36px;margin:20px 0}.entry img{width:66px}.entry label{display:block;margin:17px 0}.entry input{display:block;width:100%;padding:13px;margin-top:7px;background:#2a2030;border:1px solid #bba5c5;border-radius:10px;color:#fff;font:inherit}.entry button{padding:13px 18px;border:0;border-radius:12px;background:#cbd9bd;color:#34253b;font:inherit;cursor:pointer}.entry nav{display:flex;gap:12px}.entry nav button{background:transparent;color:#ddd0e4;border:1px solid #a38caf}.entry a{color:#d0e2c5}.notice{min-height:3em;line-height:1.6;color:#e3c8d2}</style></head><body><main class="entry"><img src="assets/orbital-star.svg" alt=""><h1>Твій кавовий простір</h1><nav aria-label="Вхід або реєстрація"><button id="loginMode" type="button">Увійти</button><button id="signupMode" type="button">Створити акаунт</button></nav><form id="entryForm"><label id="nameLabel" hidden>Твоє ім’я<input id="name" maxlength="60" autocomplete="given-name"></label><label>Електронна пошта<input id="email" type="email" required autocomplete="email"></label><label>Пароль<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button id="submitEntry">Увійти →</button><p id="entryStatus" class="notice" role="status"></p></form><a href="cafe.html">Повернутися до кав’ярні ↗</a></main><script src="site-config.js"></script><script src="auth-client.js"></script><script>const by=id=>document.getElementById(id),query=new URLSearchParams(location.search),pages=new Set(['guest.html','cafe.html','menu.html','create.html','story.html','orders.html','workshop.html']);let signup=false;const target=String(query.get('return_to')||'guest.html').replace(/^\//,'').split(/[?#]/)[0],next=pages.has(target)?target:'guest.html';function mode(value){signup=value;by('nameLabel').hidden=!value;by('name').required=value;by('submitEntry').textContent=value?'Створити акаунт →':'Увійти →';by('password').autocomplete=value?'new-password':'current-password';by('entryStatus').textContent='';}by('loginMode').onclick=()=>mode(false);by('signupMode').onclick=()=>mode(true);by('entryForm').onsubmit=async e=>{e.preventDefault();const b=by('submitEntry');b.disabled=true;try{const email=by('email').value.trim(),password=by('password').value;if(signup){const r=await CafeAuth.signup(email,password,by('name').value.trim());if(!r.access_token){by('entryStatus').textContent='Перевір пошту й підтвердь акаунт. Після підтвердження повернися та увійди.';return;}}else await CafeAuth.login(email,password);location.href=next;}catch(error){by('entryStatus').textContent=error.message;}finally{b.disabled=false;}};if(query.has('signout'))CafeAuth.logout().then(()=>location.href='cafe.html');</script></body></html>
